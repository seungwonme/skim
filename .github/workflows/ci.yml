name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup just
        run: brew install just

      - name: Install JavaScript dependencies
        run: pnpm install

      - name: Sync Python workspace
        # --frozen: 재해석하지 않고 uv.lock에 적힌 버전 그대로 설치한다.
        # 그냥 uv sync면 CI가 로컬과 다른 버전으로 통과할 수 있다.
        # --locked는 쓸 수 없다. uv.lock이 상대 exclude-newer(span)를 기록하는데
        # 그건 사용자 전역 uv 설정이라 CI에는 없고, 그 차이만으로 재해석이 필요하다고 판정한다.
        run: uv sync --frozen

      - name: Install Playwright browsers
        run: uv run playwright install

      - name: Lint
        run: just lint

      - name: Test
        run: just test

      - name: Build
        run: just build

      - name: Desktop e2e
        run: just e2e
