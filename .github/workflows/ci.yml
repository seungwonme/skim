name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 커밋 메시지 검사가 PR의 base부터 head까지의 커밋을 읽는다.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup just
        run: brew install just

      - name: Install JavaScript dependencies
        run: pnpm install

      - name: Commit messages
        # 로컬 commit-msg 훅은 새 worktree에서 조용히 건너뛰어진다. 훅 디렉터리(.husky/_)가
        # 체크아웃마다 pnpm install로 따로 생기기 때문이다. PR 커밋은 여기서 한 번 더 본다.
        if: github.event_name == 'pull_request'
        run: >-
          pnpm exec commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

      - name: Sync Python workspace
        # --frozen: 재해석하지 않고 uv.lock에 적힌 버전 그대로 설치한다.
        # 그냥 uv sync면 CI가 로컬과 다른 버전으로 통과할 수 있다.
        # --locked는 쓸 수 없다. uv.lock이 상대 exclude-newer(span)를 기록하는데
        # 그건 사용자 전역 uv 설정이라 CI에는 없고, 그 차이만으로 재해석이 필요하다고 판정한다.
        run: uv sync --frozen

      - name: Install Playwright browsers
        run: uv run playwright install

      - name: Lint
        run: just lint

      - name: Test
        run: just test

      - name: Build
        run: just build

      - name: Desktop e2e
        run: just e2e
