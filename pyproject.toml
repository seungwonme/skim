[project]
name = "skim-workspace"
version = "0.2.0"
description = "Skim monorepo workspace"
requires-python = ">=3.12"
dependencies = ["skim-cli"]

[dependency-groups]
dev = [
    "flake8>=7.1.2",
    "isort>=6.0.1",
    "pylint>=3.3.4",
    "pytest>=8.3.5",
    "ruff>=0.16.3",
]

[tool.uv]
package = false

[tool.uv.sources]
skim-cli = { workspace = true }
skim-core = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[tool.isort]
py_version = 312
line_length = 88
atomic = true
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
known_first_party = ["skim_cli", "skim_core"]
known_third_party = []

# 포맷터는 ruff 하나다. 편집 훅도 파일을 고칠 때마다 `ruff format`을 돌린다. 예전에는
# black(100자) 설정만 있어 훅(ruff 기본 88자)과 폭이 어긋났고, 고친 파일마다 상관없는
# 줄이 diff에 섞였다. isort 폭도 같게 둔다.
[tool.ruff]
line-length = 88
target-version = "py312"
# 기본값은 docs/의 마크다운 코드 블록까지 포맷한다. 파이썬 파일만 본다.
include = ["*.py", "*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
pythonpath = ["packages/skim-core/src", "packages/skim-cli/src"]
